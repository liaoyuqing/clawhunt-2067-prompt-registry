[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eval-registry"
version = "0.1.0"
description = "Prompt and model-profile version registry with evaluation traceability"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "SQLAlchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
packages = [
  "app",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
